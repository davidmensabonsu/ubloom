workflows:
  ios-release:
    name: uBloom iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodeMagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.despia.ubloom
      node: 22
      xcode: latest
    scripts:
      - name: Set build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "6784313632" --pre-release-version 1.0 2>/dev/null || echo "1")
          cd ios/App
          agvtool new-version -all $((LATEST_BUILD + 1))
      - name: Install dependencies
        script: |
          nvm install 22
          nvm use 22
          npm install
      - name: Build web assets
        script: |
          nvm use 22
          npm run build
      - name: Capacitor sync
        script: |
          nvm use 22
          npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcodeproj/project.xcworkspace \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
