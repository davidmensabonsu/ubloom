workflows:
  ios-release:
    name: uBloom iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodeMagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.despia.ubloom
      node: 22
      xcode: latest
    scripts:
      - name: Set build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "6784313632")
          if [ -z "$LATEST_BUILD" ]; then
            echo "ERROR: could not fetch latest TestFlight build number; refusing to guess." >&2
            echo "A guessed number can collide with an existing build, and App Store Connect" >&2
            echo "silently drops duplicate build numbers after upload - TestFlight then keeps" >&2
            echo "serving the previous binary even though this build reports success." >&2
            exit 1
          fi
          echo "Latest TestFlight build: $LATEST_BUILD -> new build: $((LATEST_BUILD + 1))"
          cd ios/App
          agvtool new-version -all $((LATEST_BUILD + 1))
      - name: Install dependencies
        script: |
          nvm install 22
          nvm use 22
          npm install
      - name: Build web assets
        script: |
          nvm use 22
          npm run build
      - name: Capacitor sync
        script: |
          nvm use 22
          npx cap sync ios
      - name: Verify shipped config has no remote server URL
        script: |
          echo "--- ios/App/App/capacitor.config.json (this exact file ships in the ipa) ---"
          cat ios/App/App/capacitor.config.json
          if grep -nE '"url"|lovableproject\.com' ios/App/App/capacitor.config.json; then
            echo "ERROR: synced Capacitor config contains a server URL - the app would load a remote page instead of the bundled assets." >&2
            exit 1
          fi
          if grep -Rln 'lovableproject\.com' dist ios/App/App/public; then
            echo "ERROR: lovableproject.com reference found in built web assets." >&2
            exit 1
          fi
          echo "Checking which Supabase credentials were baked into the bundle..."
          env | grep -o '^VITE_[A-Za-z_]*' && echo "WARNING: the VITE_ variables above are set in the CI environment and OVERRIDE the committed .env" || echo "No VITE_ overrides in CI environment (good - .env is the source of truth)"
          if ! grep -rq 'dgyynvfzoepjhcpjpdbs' dist/assets; then
            echo "ERROR: built bundle does not contain the expected Supabase project URL." >&2
            exit 1
          fi
          if ! grep -rq '2D3AbsR1MluVwLZutBuy1UAo7c8qvdVL1' dist/assets; then
            echo "ERROR: built bundle does not contain the expected Supabase publishable key from .env - a stale CI environment variable is likely overriding it." >&2
            exit 1
          fi
          echo "OK: config is clean, correct Supabase credentials baked in, app will load from the local bundle."
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcodeproj/project.xcworkspace \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
