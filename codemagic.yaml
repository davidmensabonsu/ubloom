workflows:
  ios-release:
    name: uBloom iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodeMagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.despia.ubloom
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          nvm install 22
          nvm use 22
          npm install
      - name: Build web assets
        script: |
          nvm use 22
          npm run build
      - name: Capacitor sync
        script: |
          nvm use 22
          npx cap sync ios
      - name: Build iOS
        script: |
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_PATH="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_PATH"
          
          xcodebuild \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -config Release \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=8C5YTZYL7J \
            archive
          
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_PATH" \
            -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
